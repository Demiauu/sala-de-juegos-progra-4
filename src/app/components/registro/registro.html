<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">
  <div class="glass-card p-4 shadow" style="max-width: 550px; width: 100%;">
    
    <div class="text-center mb-4">
      <h2 class="fw-bold">📝 Crear Cuenta</h2>
      <p class="text-muted small">Regístrate para guardar tus puntajes en la sala</p>
    </div>

    @if (mensajeError()) {
      <div class="alert alert-danger text-center p-2 mb-3" style="font-size: 14px;">
        {{ mensajeError() }}
      </div>
    }
    @if (mensajeExito()) {
      <div class="alert alert-success text-center p-2 mb-3" style="font-size: 14px;">
        {{ mensajeExito() }}
      </div>
    }

    <form #miForm="ngForm" (ngSubmit)="registrarse()">
      
      <div class="row g-2 mb-3">
        <div class="col-4">
          <div class="form-floating">
            <input type="text" class="form-control" id="inputNombre" placeholder="Nombre" 
                   [(ngModel)]="nombre" name="nombre" required>
            <label for="inputNombre" class="text-dark">Nombre</label>
          </div>
        </div>
        
        <div class="col-4">
          <div class="form-floating">
            <input type="text" class="form-control" id="inputApellido" placeholder="Apellido" 
                   [(ngModel)]="apellido" name="apellido" required>
            <label for="inputApellido" class="text-dark">Apellido</label>
          </div>
        </div>
        
        <div class="col-4">
          <div class="form-floating">
            <input type="number" class="form-control" id="inputEdad" placeholder="Edad" 
                   [(ngModel)]="edad" name="edad" min="1" required>
            <label for="inputEdad" class="text-dark">Edad</label>
          </div>
        </div>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="regInputEmail" placeholder="name@example.com" 
               [(ngModel)]="email" name="email" required email>
        <label for="regInputEmail" class="text-dark">Correo electrónico</label>
      </div>

      <div class="form-floating mb-4">
        <input type="password" class="form-control" id="regInputPassword" placeholder="Contraseña" 
               [(ngModel)]="clave" name="clave" required minlength="6">
        <label for="regInputPassword" class="text-dark">Contraseña</label>
      </div>

      <button class="btn btn-success w-100 py-2 fw-bold mb-3 shadow-sm" type="submit" [disabled]="!miForm.valid">
        Registrarse
      </button>
    </form>

    <hr class="opacity-25 my-3">

    <div class="text-center">
      <p class="small mb-0 text-muted">
        ¿Ya tienes una cuenta? 
        <a routerLink="/login" class="text-info fw-bold text-decoration-none ms-1">Inicia sesión</a>
      </p>
    </div>

  </div>
</div>
