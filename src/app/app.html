<header class="py-3 mb-5" style="background: var(--navbar-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border);">
  <div class="container d-flex justify-content-between align-items-center">
    
    <h1 class="h3 m-0">
      <a routerLink="/" class="text-white text-decoration-none d-flex align-items-center gap-2 custom-logo">
        <img src="favicon.ico" alt="Logo" style="width: 32px; height: 32px; object-fit: contain;">
        <span class="fw-bold tracking-tight" style="letter-spacing: -0.5px;">Sala de Juegos</span>
      </a>
    </h1>
    
    <nav class="d-flex align-items-center gap-2">
      
      <button (click)="toggleTema()" class="btn btn-sm px-3 me-2" [class.btn-outline-warning]="temaActual() === 'dark'" [class.btn-outline-dark]="temaActual() === 'light'" title="Cambiar tema">
        @if (temaActual() === 'dark') {
          ☀️
        } @else {
          🌙
        }
      </button>

      <button routerLink="/quien-soy" class="btn btn-outline-light btn-sm px-3" style="color: var(--text-main); border-color: var(--glass-border);">Quién Soy</button>

      @if (!authService.usuarioLogueado()) {
        <button routerLink="/login" class="btn btn-outline-primary btn-sm px-3 style-login-btn" style="color: var(--text-main);">Iniciar Sesión</button>
        <button routerLink="/registro" class="btn btn-primary btn-sm px-3">Registrarse</button>
      } @else {
        <span class="small me-2" style="color: var(--text-muted);">
          Jugador: <strong class="text-info fw-semibold">{{ (authService.usuarioLogueado())?.displayName || authService.usuarioLogueado()?.email }}</strong>
        </span>
        <button (click)="authService.logout()" class="btn btn-danger btn-sm px-3">
          Salir
        </button>
      }
    </nav>
  </div>
</header>

<div class="container">
  <router-outlet></router-outlet>
</div>
